name: Build

on:
  push:
  workflow_dispatch:

# The build only needs to read the repo; artifact upload doesn't use this token.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        # No -G: CMake picks the newest Visual Studio installed, so runner image upgrades don't break this.
        run: cmake -B build -A x64

      - name: Configure (macOS, universal binary)
        if: runner.os == 'macOS'
        run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SimpleReverb-${{ matrix.name }}
          path: |
            build/SimpleReverb_artefacts/Release/VST3
            build/SimpleReverb_artefacts/Release/AU
